version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nexusbrain-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"  # FalkorDB / Redis Graph Cypher Protocol
      - "3000:3000"  # FalkorDB Browser / Web UI
    environment:
      - FALKORDB_ARGS=--appendonly yes
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkordb_data:
    driver: local
